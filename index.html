<!DOCTYPE html>
<html>
<body>

<style>

h1 {
    color: red;
    margin: 85px;
    font-family: georgia;
    font-size: 50px;
}
     
p {
   color: yellow;
   font-size: 80px;
   margin: 70px;
}

body {
    font-size: 30px;
    background-color: #754478;
}

button {
    font-size: 20px;
    font-family: "Trebuchet MS";
    padding: 20px;
    margin: 35px;
    background-color: orange;
    color: black;
    border-radius: 50px; 
}

button:hover {
    transform: scale(1.2);
}

</style>

<h1 id="title">My Very First Program</h1> 

<button id="killer" onclick="next()">Kill Me</button>

<button onclick="cat()">Don't Press</button>

<button onclick="fish()">Home</button>

<button onclick="addText()">Guess</button>

<button id="coward" onclick="changeText()" onmouseover="runAway()">Catch Me</button>

<p id="counter">

<script>

    let colors = [ "red", "pink", "green", "yellow"];

    let count = 0

    let gameOver = false;

function next() {
    if (document.getElementById("killer").textContent =="Kill Me") {
        document.getElementById("killer").textContent = "You Killed Me!";
    } else {
        document.getElementById("killer").textContent = "Kill Me";
    }
}

function cat() {
    let cat = [
        "You really thought this was a good idea?",
        "Your website is terrible.",
        "Congratulations. You pressed a button.",
        "Go outside.",
        "That was disapointing.",
        "Maybe stick to fishing.",
    ];

    let random = Math.floor(Math.random() * cat.length);

    document.getElementById("title").textContent = cat[random];
}

function fish() {
    document.getElementById("title").textContent = "My Very First Program";
}
 
function addText() {
    let newText = document.createElement("p");
    newText.textContent = "Hello down there!";  
    document.body.appendChild(newText);
}

function runAway() {
  
    let button = document.getElementById("coward");
    
    if (gameOver == true) {
        return;
    }

    count = count + 1; 
    document.getElementById("counter").textContent = count;
    if (count == 10) {
        document.getElementById("coward").textContent = "I Win"
        button.style.position = "static"
        button.style.left = ""
        button.style.top = ""
    }

    if (count == 10) {
        gameOver = true;
        return;
    }

    button.style.position = "absolute";  
    button.style.left = Math.random() * 500 + "px";
    button.style.top = Math.random() * 500 + "px";
    button.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
}
 
function changeText() {
  
    if (gameOver == true) {
        return;
    } 

 document.getElementById("coward").textContent = "Good Catch";
}

</script>

</body>
</html>
